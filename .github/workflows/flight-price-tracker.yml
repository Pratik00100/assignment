name: Flight price tracker (MEL -> KTM)

on:
  schedule:
    # 20:00 UTC daily = 06:00 AEDT / 07:00 AEST next day (Melbourne).
    # Adjust the hour if you want it to land at a different local time.
    - cron: '0 20 * * *'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: flight-price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run price tracker
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python3 flight-tracker/track_flights.py

      - name: Commit updated price history
        run: |
          git config user.name "flight-price-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add flight-tracker/data/price-history.csv
          if git diff --cached --quiet; then
            echo "No changes to price-history.csv"
          else
            git commit -m "chore(flight-tracker): log price run $(date -u +%Y-%m-%d)"
            git push
          fi
